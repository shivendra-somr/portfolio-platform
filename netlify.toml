# Netlify: connect the repo; these settings are picked up automatically.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Forward API + API docs to the Spring Boot backend on Render (same-origin, so no CORS).
# Backend: Render service portfolio-backend-734x
[[redirects]]
  from = "/api/*"
  to = "https://portfolio-backend-734x.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/swagger-ui/*"
  to = "https://portfolio-backend-734x.onrender.com/swagger-ui/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/swagger-ui.html"
  to = "https://portfolio-backend-734x.onrender.com/swagger-ui/index.html"
  status = 200
  force = true

[[redirects]]
  from = "/v3/api-docs/*"
  to = "https://portfolio-backend-734x.onrender.com/v3/api-docs/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/v3/api-docs"
  to = "https://portfolio-backend-734x.onrender.com/v3/api-docs"
  status = 200
  force = true

# SPA fallback: client-side routes like /blog/my-post serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
