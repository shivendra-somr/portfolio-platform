services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: portfolio
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: ${DB_PASSWORD:-portfolio}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U portfolio"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # Catches outgoing mail locally: UI at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["8025:8025", "1025:1025"]

  backend:
    build: ./backend
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/portfolio
      DB_USERNAME: portfolio
      DB_PASSWORD: ${DB_PASSWORD:-portfolio}
      REDIS_HOST: redis
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_ENABLED: "true"
      CONTACT_NOTIFY_TO: ${CONTACT_NOTIFY_TO:-me@example.com}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      APP_SITE_URL: http://localhost:3000
    ports: ["8080:8080"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["3000:80"]

volumes:
  pgdata:
